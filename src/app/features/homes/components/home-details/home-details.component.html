<div class="map-detail">
  <button class="close" (click)="closeDetails.emit()" aria-label="Close home detail">×</button>
  <h2>{{ h.title }}</h2>
  <p>{{ h.address }}</p>
  <div class="detail-stats">
    <strong>{{ money(h.price + h.fees) }}<small> / mo incl. fees</small></strong
    ><span>Energy {{ h.energy }}</span>
  </div>
  <p class="notes">{{ h.notes }}</p>
  <div class="detail-actions">
    <a *ngIf="h.url" [href]="h.url" target="_blank" rel="noopener noreferrer"
      >Original listing ↗</a
    >
  </div>
</div>
