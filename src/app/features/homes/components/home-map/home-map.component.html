<div #canvas class="map-canvas" aria-label="Mappa degli immobili"></div>
<div class="map-top">
  <span title="Importi mensili: canone + condominio"
    ><i></i> {{ homes.length }} {{ homes.length === 1 ? 'immobile' : 'immobili' }}</span
  >
  <button (click)="fit()">⌖ Mostra tutti</button>
</div>
<p class="tile-error" *ngIf="tileError()" role="status">
  Impossibile caricare la mappa. Controlla la connessione a Internet. I dettagli degli immobili
  restano disponibili.
</p>
