<div #canvas class="map-canvas" aria-label="Map of homes"></div>
<div class="map-top">
  <span><i></i> {{ homes.length }} homes</span>
  <button (click)="fit()">⌖ Fit all homes</button>
</div>
<p class="tile-error" *ngIf="tileError()" role="status">
  Map tiles could not be loaded. Check your internet connection. Home details remain available.
</p>
<ng-content />
