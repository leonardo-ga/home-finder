<div class="modal-backdrop">
  <section
    class="modal"
    appDialogFocus
    role="dialog"
    aria-modal="true"
    aria-labelledby="edit-title"
  >
    <div class="modal-heading">
      <div>
        <div class="eyebrow">MAKE IT YOURS</div>
        <h2 id="edit-title">Home details</h2>
      </div>
      <button (click)="cancel.emit()" aria-label="Close editor">×</button>
    </div>
    <p class="notice" role="alert" *ngIf="error">{{ error }}</p>
    <form (ngSubmit)="saveHome.emit(h)" #homeForm="ngForm">
      <div class="form-grid">
        <label class="wide"
          >Home title<input
            name="title"
            [(ngModel)]="h.title"
            required
            placeholder="A sunny apartment near the park" /></label
        ><label class="wide"
          >Address / neighborhood<input name="address" [(ngModel)]="h.address" required /></label
        ><label
          >Monthly rent (€)<input
            name="price"
            type="number"
            [(ngModel)]="h.price"
            min="1"
            required /></label
        ><label
          >Monthly fees (€)<input
            name="fees"
            type="number"
            [(ngModel)]="h.fees"
            min="0"
            required /></label
        ><label
          >Area (m²)<input name="sqm" type="number" [(ngModel)]="h.sqm" min="1" required /></label
        ><label
          >Rooms<input name="rooms" type="number" [(ngModel)]="h.rooms" min="1" required /></label
        ><label
          >Bathrooms<input
            name="bathrooms"
            type="number"
            [(ngModel)]="h.bathrooms"
            min="1"
            required /></label
        ><label>Floor<input name="floor" type="number" [(ngModel)]="h.floor" required /></label
        ><label
          >Latitude<input
            name="lat"
            type="number"
            step="any"
            [(ngModel)]="h.lat"
            min="-90"
            max="90"
            required /></label
        ><label
          >Longitude<input
            name="lng"
            type="number"
            step="any"
            [(ngModel)]="h.lng"
            min="-180"
            max="180"
            required
        /></label>
        <p class="form-help wide">
          Find coordinates by right-clicking a location in Google Maps. The default is central
          Milan; replace it with the home's actual position.
        </p>
        <label
          >Energy class<select name="energy" [(ngModel)]="h.energy">
            <option>Unknown</option>
            <option>A4</option>
            <option>A3</option>
            <option>A2</option>
            <option>A1</option>
            <option>A</option>
            <option>B</option>
            <option>C</option>
            <option>D</option>
            <option>E</option>
            <option>F</option>
            <option>G</option>
          </select></label
        ><label
          >Status<select name="status" [(ngModel)]="h.status">
            <option *ngFor="let s of statuses">{{ s }}</option>
          </select></label
        ><label class="checkbox"
          ><input name="elevator" type="checkbox" [(ngModel)]="h.elevator" /> Elevator</label
        ><label class="checkbox"
          ><input name="outdoor" type="checkbox" [(ngModel)]="h.outdoor" /> Balcony / garden</label
        ><label class="wide"
          >Original listing URL<input
            name="url"
            type="url"
            [(ngModel)]="h.url"
            placeholder="https://..." /></label
        ><label class="wide"
          >Photo URL (optional)<input
            name="photo"
            type="url"
            [(ngModel)]="h.photo"
            placeholder="https://..." /></label
        ><label class="wide"
          >Notes, pros & cons<textarea name="notes" [(ngModel)]="h.notes" rows="3"></textarea>
        </label>
      </div>
      <p class="form-help">
        Changes stay in this browser. Export a backup to keep a separate copy.
      </p>
      <div class="modal-actions">
        <button type="button" (click)="cancel.emit()">Cancel</button
        ><button class="primary" type="submit" [disabled]="homeForm.invalid || saving">
          Save home
        </button>
      </div>
    </form>
  </section>
</div>
