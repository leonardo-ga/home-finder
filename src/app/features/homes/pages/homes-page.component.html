<header><h1>Home Finder</h1></header>
<main>
  <section class="workspace" aria-label="Home catalogue and map">
    <div class="listing-panel">
      <div class="list-heading">
        <h2>
          Catalogue <span>{{ store.homes.length }}</span>
        </h2>
      </div>
      <div class="cards">
        <app-home-card
          *ngFor="let home of store.homes; let i = index; trackBy: trackHome"
          [h]="home"
          [index]="i"
          [selected]="store.selectedId() === home.id"
          (selectHome)="store.select($event.id)"
        />
        <div class="empty" *ngIf="!store.homes.length"><h2>No homes in the catalogue</h2></div>
      </div>
    </div>
    <app-home-map
      [homes]="store.homes"
      [selectedId]="store.selectedId()"
      (selectHome)="store.select($event)"
    >
      <app-home-details
        *ngIf="store.activeHome() as home"
        [h]="home"
        (closeDetails)="closeDetails()"
      />
    </app-home-map>
  </section>
</main>
